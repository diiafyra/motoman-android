name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache, so PR branches cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: ktlint, lint, unit tests, debug build
        run: ./gradlew ktlintCheck lint test assembleDebug --console=plain
      # Release shrinks and obfuscates with R8, which can break code the debug build does not. Unsigned, so
      # no secrets are needed.
      - name: Release build with R8
        run: ./gradlew assembleRelease --console=plain
      - name: Version script
        run: scripts/check-version.sh "v$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
